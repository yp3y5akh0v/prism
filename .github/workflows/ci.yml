name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "maturin>=1.12,<2" pytest numpy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked --exclude prism-python
      - run: cargo test --locked -p prism-python --no-default-features
      - run: cargo test --locked -p prism-ann --features force-scalar-sq8 quantize::tests
      - run: cargo test --release --locked -p prism-ann
      - run: cargo doc --locked -p prism-ann --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "maturin>=1.12,<2" pytest numpy
      - run: maturin build --release --locked --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -q

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --locked -p prism-ann --all-targets
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $pythonBase = & $pythonExe -c "import sys; print(sys.base_prefix)"
          $env:PYO3_PYTHON = $pythonExe
          $env:PATH = "$pythonBase;$env:PATH"
          cargo test --locked -p prism-python

  core-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p prism-ann

  python-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo check --locked -p prism-python
