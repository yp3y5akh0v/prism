[package]
name = "prism-python"
version.workspace = true
edition.workspace = true
rust-version = "1.83"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for PRISM filtered vector search"
publish = false

[lib]
name = "prism_ann"
crate-type = ["cdylib"]

# `extension-module` stops pyo3 linking libpython, which an import-time module
# wants but a standalone test binary cannot resolve. Tests build without it.
[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
prism-ann = { path = "../prism-core" }
pyo3 = { workspace = true }
numpy = { workspace = true }
rayon = { workspace = true }
