[package]
name = "prism-ann"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Filtered approximate nearest-neighbor vector search"
readme = "README.md"
keywords = ["vector-search", "ann", "filtered-search", "nearest-neighbor", "embeddings"]
categories = ["algorithms", "data-structures", "artificial-intelligence"]

[features]
# Reference/portability path used to reproduce SQ8 SIMD performance deltas.
# It changes work implementation only; candidate-distance semantics stay
# scale-aware and identical to CPUs without AVX2+FMA.
force-scalar-sq8 = []

[dependencies]
rand = { workspace = true }
rayon = { workspace = true }
byteorder = { workspace = true }
memmap2 = { workspace = true }
zeroize = { workspace = true }
